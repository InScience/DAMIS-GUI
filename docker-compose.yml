# DAMIS GUI local environment: Apache -> php-fpm (Symfony + Twig) -> MySQL
# Usage: docker compose up -d --build, then open http://localhost:8080
# Every ${VAR:-default} below can be overridden from a .env file next to this file.

name: damis

services:
  apache:
    build: ./docker/apache
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      # access log file names and times in local time (read by the awstats service)
      TZ: Europe/Vilnius
    volumes:
      - ./:/var/www/html:ro
      - apache_logs:/var/log/damis-apache
    depends_on:
      - php
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-local-docker-secret-change-me}
      # local mail goes to Mailpit (http://localhost:8025); production sets its real SMTP server here
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
      VAR_DUMPER_SERVER: ${VAR_DUMPER_SERVER:-127.0.0.1:9912}
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-damis}
      DATABASE_USER: ${MYSQL_USER:-damis}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-damis}
      PROJECT_DOMAIN: ${PROJECT_DOMAIN:-localhost}
      # Public base URL of the application
      PROJECT_FULL_HOST: ${PROJECT_FULL_HOST:-http://localhost:8080}
      # DAMIS computing service (see damis-service below and config/packages/damis.yaml):
      # WSDL of the service (overrides the hosts stored in the component table) and the
      # application address the service uses to download dataset files
      DAMIS_SERVICE_WSDL: ${DAMIS_SERVICE_WSDL:-http://damis-service/cgi-bin/DamisService.cgi?wsdl}
      DAMIS_DATA_HOST: ${DAMIS_DATA_HOST:-http://apache}
      # static AWStats pages shown to administrators (see the awstats service)
      DAMIS_AWSTATS_DIR: /var/lib/damis-awstats
    volumes:
      - ./:/var/www/html
      # Crontabs written from the /cron admin page survive container re-creation
      - php_crontabs:/var/spool/cron/crontabs
      # output of the cron jobs (log files set on the /cron page)
      - cron_logs:/var/log/cron
      - awstats_html:/var/lib/damis-awstats:ro
    depends_on:
      mysql:
        condition: service_healthy
      damis-service:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-damis}
      MYSQL_USER: ${MYSQL_USER:-damis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-damis}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      # localhost only: Docker's published ports bypass the host firewall
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/import:/damis/import:ro
      - ./sql:/damis/sql:ro
    healthcheck:
      # TCP ping on purpose: the init phase runs with networking disabled, so this only passes once seeding is done
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  # DAMIS computing service: DamisService.cgi (SOAP, Apache CGI) + the MPI Algorithms binary, built from
  # the sibling repositories DAMIS_WebService and DAMIS. Only reachable by the other containers; the
  # port below is bound to localhost for debugging (the service downloads any URL it is given).
  damis-service:
    build:
      context: ${DAMIS_WEBSERVICE_DIR:-../DAMIS_WebService}
      dockerfile: docker/Dockerfile
      args:
        UBUNTU_VERSION: ${DAMIS_SERVICE_UBUNTU_VERSION:-26.04}
      additional_contexts:
        algorithms: ${DAMIS_ALGORITHMS_DIR:-../DAMIS}
    environment:
      SERVICE_URL: http://damis-service/cgi-bin/DamisService.cgi
      DATA_URL: http://damis-service/DamisData/
      # empty = number of CPUs of the container; the GUI "processor number" must not exceed it
      MPI_PROCESSES: ${DAMIS_MPI_PROCESSES:-}
      MAX_RUN_TIME: ${DAMIS_MAX_RUN_TIME:-3300}
    ports:
      - "127.0.0.1:${DAMIS_SERVICE_PORT:-8087}:80"
    volumes:
      - damis_data:/var/lib/damis/data
      - damis_logs:/var/log/damis
    restart: unless-stopped

  # Local mail catcher: every e-mail the application sends (password reset, registration) is shown at
  # http://localhost:8025 instead of being delivered.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  # Web statistics (AWStats): reads the apache access logs every hour and builds static pages (LT, EN) that
  # administrators open in the application (admin menu, /admin/statistics). Logs are kept LOG_RETENTION_DAYS.
  awstats:
    build: ./docker/awstats
    environment:
      AWSTATS_SITE_DOMAIN: ${AWSTATS_SITE_DOMAIN:-damis.midas.lt}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
      TZ: Europe/Vilnius
    volumes:
      - apache_logs:/var/log/damis-apache
      - awstats_data:/var/lib/awstats
      - awstats_html:/var/www/awstats
    restart: unless-stopped

volumes:
  mysql_data:
  php_crontabs:
  cron_logs:
  damis_data:
  damis_logs:
  apache_logs:
  awstats_data:
  awstats_html:
