# Included by the damis.midas.lt virtual hosts (http and https); deploy/deploy.sh adds the Include line.

# Access log files for AWStats (docker/awstats/damis-awstats-update): one file per day, local time.
# Requests from this server itself (the computing service downloading datasets via http://127.0.0.1) are not visits.
SetEnvIf Remote_Addr "^(127\.0\.0\.1|::1)$" damis_internal
CustomLog "|/usr/bin/rotatelogs -l /var/log/damis-apache/access.%Y-%m-%d.log 86400" combined env=!damis_internal

# Never run or serve PHP files from the upload directories
<LocationMatch "(?i)^/uploads/.*\.(php[0-9]?|phtml|phar)$">
    Require all denied
</LocationMatch>
