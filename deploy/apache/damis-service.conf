# DamisService (SOAP CGI) and its result files, for the GUI on this server only (deploy/deploy.sh).
# Not public: the service downloads any URL it receives in the X parameter and runs mpirun.
Listen 127.0.0.1:8080

<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    DocumentRoot /var/www/html

    # an algorithm may run up to maxRunTime (3300 s) inside one CGI request
    Timeout 3600

    # only the service; /usr/lib/cgi-bin also holds awstats.pl and older binaries
    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
    <Directory /usr/lib/cgi-bin>
        Options +ExecCGI -Indexes
        AllowOverride None
        Require all denied
        <Files "DamisService.cgi">
            Require local
        </Files>
    </Directory>

    # results (Y / Yalt) downloaded by the GUI; only _output_* files
    Alias /DamisData/ /var/lib/damis/data/
    <Directory /var/lib/damis/data>
        Options -Indexes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all denied
        <FilesMatch "^_output_[A-Za-z0-9]+\.arff$">
            Require local
            ForceType "text/plain; charset=utf-8"
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/damis_service_error.log
    CustomLog ${APACHE_LOG_DIR}/damis_service_access.log combined
</VirtualHost>
