ServerName ${DAMIS_SERVER_NAME}

# Long running uploads/conversions (matches max_execution_time in php)
Timeout 3600
ProxyTimeout 3600

# php-fpm (php container): after a restart of that container, try it again on the next request (the default
# would answer 503 for 60 s) and look its address up again (it may get a new one)
<Proxy "fcgi://php:9000">
    ProxySet retry=0 disablereuse=On
</Proxy>

# Requests from the other containers (the computing service downloading datasets from http://apache, tests)
SetEnvIf Host "^apache(:[0-9]+)?$" damis_internal

# Server-wide, so both virtual hosts share them
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined
# Access log files for AWStats (docker/awstats): one file per day, local time (TZ); internal requests are not visits
CustomLog "|/usr/local/apache2/bin/rotatelogs -l /var/log/damis-apache/access.%Y-%m-%d.log 86400" combined env=!damis_internal

<VirtualHost *:80>
    Include conf/extra/damis-app.conf

    <IfDefine DAMIS_SSL>
        # Everything to https, except the other containers and /uploads/ (plain http, as on the old server)
        RewriteEngine On
        RewriteCond %{ENV:damis_internal} !=1
        RewriteCond %{REQUEST_URI} !^/uploads/
        RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=301,L]
    </IfDefine>
</VirtualHost>

# Production (docker-compose.prod.yml): certificate files mounted into conf/ssl/
<IfDefine DAMIS_SSL>
    Listen 443
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)

    <VirtualHost *:443>
        Include conf/extra/damis-app.conf
        SSLEngine on
        SSLCertificateFile /usr/local/apache2/conf/ssl/server.crt
        SSLCertificateKeyFile /usr/local/apache2/conf/ssl/server.key
        SSLCertificateChainFile /usr/local/apache2/conf/ssl/chain.crt
    </VirtualHost>
</IfDefine>
