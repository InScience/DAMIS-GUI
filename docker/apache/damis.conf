ServerName localhost

# Long running uploads/conversions (matches max_execution_time in php)
Timeout 3600
ProxyTimeout 3600

<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # public/css, public/js, public/docs, ... are symlinks into web/
    <Directory /var/www/html/web>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Never execute uploaded files
    <Directory /var/www/html/public/uploads>
        FallbackResource disabled
        <FilesMatch \.php$>
            SetHandler none
            Require all denied
        </FilesMatch>
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php:9000"
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # Access log files for AWStats (docker/awstats): one file per day, local time (TZ). Requests from the
    # other containers (the computing service downloading datasets from http://apache, tests) are not visits.
    SetEnvIf Host "^apache(:[0-9]+)?$" damis_internal
    CustomLog "|/usr/local/apache2/bin/rotatelogs -l /var/log/damis-apache/access.%Y-%m-%d.log 86400" combined env=!damis_internal
</VirtualHost>
