; PHP settings required by DAMIS (moved here from web/.htaccess, php-fpm ignores php_value)
date.timezone = Europe/Vilnius
max_execution_time = 3600
post_max_size = 110M
upload_max_filesize = 100M
; memory limit should be at least upload_max_filesize x6
memory_limit = 768M
default_socket_timeout = 6000
log_errors = On
display_errors = Off
session.cookie_lifetime = 3600
session.gc_maxlifetime = 3600
